<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0a;--surface:#111;--border:#222;--text:#e5e5e5;--muted:#888;--accent:#00ff88;--accent2:#ff6600;--font:'SF Mono',SFMono-Regular,ui-monospace,'DejaVu Sans Mono',Menlo,Consolas,monospace}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}

.container{max-width:960px;margin:0 auto;padding:0 24px}

/* Hero */
.hero{text-align:center;padding:80px 24px 60px;border-bottom:1px solid var(--border)}
.hero img{width:64px;height:64px;margin-bottom:16px}
.hero h1{font-size:2.5rem;font-weight:700;letter-spacing:-1px;margin-bottom:8px}
.hero h1 span{color:var(--accent)}
.hero .tagline{font-size:1rem;color:var(--muted);max-width:520px;margin:0 auto 24px}
.hero .cta{display:inline-block;background:var(--accent);color:#000;font-weight:700;padding:12px 32px;font-size:.85rem;text-transform:uppercase;letter-spacing:1px;transition:all .2s}
.hero .cta:hover{background:#fff;text-decoration:none}

/* Lang selector */
.lang-bar{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;padding:16px 24px;border-bottom:1px solid var(--border);background:var(--surface)}
.lang-bar button{background:transparent;border:1px solid var(--border);color:var(--muted);padding:4px 10px;font-size:.7rem;font-family:var(--font);cursor:pointer;transition:all .15s}
.lang-bar button:hover,.lang-bar button.active{border-color:var(--accent);color:var(--accent)}

/* Features */
.features{padding:60px 24px;border-bottom:1px solid var(--border)}
.features h2{text-align:center;font-size:1.2rem;text-transform:uppercase;letter-spacing:3px;color:var(--accent2);margin-bottom:40px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;max-width:960px;margin:0 auto}
.card{border:1px solid var(--border);padding:24px;background:var(--surface);transition:border-color .2s}
.card:hover{border-color:var(--accent)}
.card h3{font-size:.85rem;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;color:var(--accent)}
.card p{font-size:.8rem;color:var(--muted);line-height:1.5}

/* Workflow */
.workflow{padding:60px 24px;border-bottom:1px solid var(--border)}
.workflow h2{text-align:center;font-size:1.2rem;text-transform:uppercase;letter-spacing:3px;color:var(--accent2);margin-bottom:40px}
.steps{display:flex;gap:0;max-width:960px;margin:0 auto;flex-wrap:wrap}
.step{flex:1;min-width:200px;padding:24px;border:1px solid var(--border);position:relative}
.step .num{font-size:2rem;font-weight:700;color:var(--accent);opacity:.3;position:absolute;top:12px;right:16px}
.step h3{font-size:.8rem;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.step p{font-size:.75rem;color:var(--muted)}

/* Screenshots */
.screenshots{padding:60px 24px;border-bottom:1px solid var(--border);text-align:center}
.screenshots h2{font-size:1.2rem;text-transform:uppercase;letter-spacing:3px;color:var(--accent2);margin-bottom:40px}
.screenshots img{max-width:100%;border:1px solid var(--border);margin-bottom:12px}
.screenshots .caption{font-size:.7rem;color:var(--muted);margin-bottom:32px}

/* Footer */
footer{padding:40px 24px;text-align:center;font-size:.7rem;color:var(--muted)}
footer .links{margin-bottom:16px}
footer .links a{margin:0 12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-size:.65rem}
footer .links a:hover{color:var(--accent)}
footer .copy{opacity:.5}

@media(max-width:600px){
  .hero h1{font-size:1.8rem}
  .steps{flex-direction:column}
}
</style>

const langLabels = {
  en:"English","zh-Hans":"简体中文","zh-Hant":"繁體中文",ja:"日本語",ko:"한국어",
  ar:"العربية",de:"Deutsch",es:"Español",fr:"Français",it:"Italiano",
  ms:"Melayu",nl:"Nederlands",ru:"Русский"
};

let currentLang = localStorage.getItem('ql-lang') || navigator.language.split('-')[0] || 'en';
if (!i18n[currentLang]) {
  if (navigator.language === 'zh-TW' || navigator.language === 'zh-Hant') currentLang = 'zh-Hant';
  else if (navigator.language.startsWith('zh')) currentLang = 'zh-Hans';
  else currentLang = 'en';
}

function render(lang) {
  currentLang = lang;
  localStorage.setItem('ql-lang', lang);
  const t = i18n[lang];
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (t[key]) el.textContent = t[key];
  });

  // Features
  const grid = document.getElementById('featuresGrid');
  grid.innerHTML = t.features.map(([title, desc]) =>
    `<div class="card"><h3>${title}</h3><p>${desc}</p></div>`
  ).join('');

  // Steps
  const steps = document.getElementById('stepsContainer');
  steps.innerHTML = t.steps.map(([title, desc], i) =>
    `<div class="step"><span class="num">0${i+1}</span><h3>${title}</h3><p>${desc}</p></div>`
  ).join('');

  // Lang bar active state
  document.querySelectorAll('.lang-bar button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === lang);
  });

  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
}

// Build lang bar
const bar = document.getElementById('langBar');
Object.entries(langLabels).forEach(([code, label]) => {
  const btn = document.createElement('button');
  btn.textContent = label;
  btn.dataset.lang = code;
  btn.onclick = () => render(code);
  bar.appendChild(btn);
});

render(currentLang);
</script>
