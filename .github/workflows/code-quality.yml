name: Code Quality

on:
  push:
    branches:
      - main
      - develop
      - 'g[1-4]/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compiler
        run: npx tsc --noEmit

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Check for vulnerable dependencies
        run: |
          if npm audit --audit-level=high --json > audit-report.json; then
            echo "✅ No high severity vulnerabilities found"
          else
            echo "⚠️ High severity vulnerabilities detected"
            cat audit-report.json
            exit 1
          fi

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint with reporting
        run: |
          npm run lint -- --format json --output-file eslint-report.json || true
          npm run lint

      - name: Upload ESLint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-report
          path: eslint-report.json
          retention-days: 30

  pr-checks:
    name: PR Quality Checks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR title format
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          if [[ ! "$PR_TITLE" =~ ^\[(G[1-4]|HQ)/Phase[1-5]\] ]]; then
            echo "❌ PR title must follow format: [G1/Phase1] Description"
            echo "Current title: $PR_TITLE"
            exit 1
          fi
          echo "✅ PR title format is correct"

      - name: Check for conventional commits
        run: |
          COMMITS=$(git log --format=%s origin/${{ github.base_ref }}..${{ github.sha }})
          echo "Checking commit messages:"
          echo "$COMMITS"

          VALID_PATTERN="^(feat|fix|docs|style|refactor|perf|test|chore|ci|build)(\(.+\))?: .+"

          while IFS= read -r commit; do
            if [[ ! "$commit" =~ $VALID_PATTERN ]]; then
              echo "❌ Invalid commit message: $commit"
              echo "Must follow: type(scope): description"
              echo "Types: feat, fix, docs, style, refactor, perf, test, chore, ci, build"
              exit 1
            fi
          done <<< "$COMMITS"

          echo "✅ All commit messages follow conventional format"

      - name: Check for TODOs in PR
        run: |
          TODO_COUNT=$(git diff origin/${{ github.base_ref }}..HEAD | grep -i "^\+.*TODO" | wc -l || true)
          if [ "$TODO_COUNT" -gt 5 ]; then
            echo "⚠️ Warning: Found $TODO_COUNT new TODOs in this PR"
            echo "Consider creating issues for future work instead"
          else
            echo "✅ TODO count acceptable ($TODO_COUNT)"
          fi

  pr-ready:
    name: PR Ready Check
    runs-on: ubuntu-latest
    needs: [type-check, code-quality]
    if: always()

    steps:
      - name: Check all quality gates
        run: |
          TYPE_CHECK="${{ needs.type-check.result }}"
          CODE_QUALITY="${{ needs.code-quality.result }}"

          echo "Type Check: $TYPE_CHECK"
          echo "Code Quality: $CODE_QUALITY"

          if [ "$TYPE_CHECK" != "success" ] || [ "$CODE_QUALITY" != "success" ]; then
            echo "❌ Some quality checks failed"
            exit 1
          fi

          echo "✅ All quality checks passed - PR is ready"
